name: Test deployment to one.com

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: onecom-test
  cancel-in-progress: false

jobs:
  test-publisering:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: onecom-test
    env:
      DP_TEST: 'true'
      DP_BASE: ${{ vars.ONECOM_TEST_BASE || '/designporten-test/' }}
      ONECOM_SFTP_HOST: ${{ secrets.ONECOM_SFTP_HOST }}
      ONECOM_SFTP_BRUKER: ${{ secrets.ONECOM_SFTP_BRUKER }}
      ONECOM_SFTP_PASSORD: ${{ secrets.ONECOM_SFTP_PASSORD }}
      ONECOM_SFTP_PORT: ${{ secrets.ONECOM_SFTP_PORT }}
      ONECOM_SFTP_FINGERAVTRYKK: ${{ secrets.ONECOM_SFTP_FINGERAVTRYKK }}
      ONECOM_MAPPE: ${{ secrets.ONECOM_MAPPE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate required secrets and safe test destination
        run: node scripts/publiser-onecom.mjs --check
      - run: npm run verify
        env:
          DP_TEST: 'false'
          DP_BASE: '/'
      - run: npm run build:onecom:test
      - name: Configure PHP mail (optional for deployment)
        run: node scripts/skriv-epostoppsett.mjs
        env:
          SKJEMA_TIL: ${{ secrets.SKJEMA_TIL }}
          SKJEMA_FRA: ${{ secrets.SKJEMA_FRA }}
      - run: npm run lint:php
      - name: Upload only dist to the owned test directory over verified SFTP
        run: node scripts/publiser-onecom.mjs
