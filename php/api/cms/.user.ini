; Room for pictures in the CMS media library: one file of up to 20 MB, and
; memory for GD to make the smaller versions (about 10 bytes per pixel).
; The host may cap these lower; «Drift» in /cms/ shows what applies.
upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 60
